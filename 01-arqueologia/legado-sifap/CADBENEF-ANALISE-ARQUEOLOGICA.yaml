################################################################################
# SUBROUTINA INTERNA: VALIDA-CPF
################################################################################

subroutine_valida_cpf:
  linhas: "L267-L318"
  tipo: "DEFINE SUBROUTINE ... END-SUBROUTINE"
  proposito: "Validar CPF usando algoritmo módulo 11 (Receita Federal Brasil)"
  algoritmo: |
    CPF possui 11 dígitos: D1 D2 D3 D4 D5 D6 D7 D8 D9 DV1 DV2
    
    DV1 (1º dígito verificador):
      SOMA = D1×10 + D2×9 + D3×8 + D4×7 + D5×6 + D6×5 + D7×4 + D8×3 + D9×2
      RESTO = SOMA MOD 11
      Se RESTO < 2: DV1 = 0
      Senão: DV1 = 11 - RESTO
      
    DV2 (2º dígito verificador):
      SOMA = D1×11 + D2×10 + D3×9 + D4×8 + D5×7 + D6×6 + D7×5 + D8×4 + D9×3 + DV1×2
      RESTO = SOMA MOD 11
      Se RESTO < 2: DV2 = 0
      Senão: DV2 = 11 - RESTO
      
    Validação: DV1 == dígito 10 E DV2 == dígito 11

  implementacao:
    - passo: 1
      codigo: "MOVE #CPF TO #CPF-STR"
      descricao: "Converter número para string"
    - passo: 2
      codigo: "FOR #I = 1 TO 11 / MOVE SUBSTR(#CPF-STR,#I,1) TO #DIG(#I) / END-FOR"
      descricao: "Extrair cada dígito em array"
      linha: 272-275
    - passo: 3
      codigo: "Loop: #SOMA = SUM(#DIG(I) * #PESO) para I=1 to 9, PESO de 10 a 2"
      descricao: "Calcular soma ponderada para DV1"
      linha: 279-283
    - passo: 4
      codigo: "COMPUTE #RESTO = #SOMA - ((#SOMA / 11) * 11)"
      descricao: "Calcular resto (módulo 11)"
      linha: 284
    - passo: 5
      codigo: "IF #RESTO < 2 MOVE 0 TO #DV1 ELSE COMPUTE #DV1 = 11 - #RESTO"
      descricao: "Aplicar regra de ajuste"
      linha: 285-288
    - passo: 6
      codigo: "IF #DV1 NE #DIG(10) MOVE FALSE TO #CPF-VALIDO / ESCAPE ROUTINE"
      descricao: "Validar DV1 contra dígito 10"
      linha: 290-292
    - passo: 7
      codigo: "Loop: #SOMA = SUM(#DIG(I) * #PESO) para I=1 to 10, PESO de 11 a 2"
      descricao: "Calcular soma ponderada para DV2"
      linha: 296-300
    - passo: 8
      codigo: "COMPUTE #RESTO = #SOMA - ((#SOMA / 11) * 11)"
      descricao: "Calcular resto (módulo 11)"
      linha: 301
    - passo: 9
      codigo: "IF #RESTO < 2 MOVE 0 TO #DV2 ELSE COMPUTE #DV2 = 11 - #RESTO"
      descricao: "Aplicar regra de ajuste"
      linha: 302-305
    - passo: 10
      codigo: "IF #DV2 NE #DIG(11) MOVE FALSE TO #CPF-VALIDO"
      descricao: "Validar DV2 contra dígito 11"
      linha: 307-309

  casos_teste:
    - cpf: "11144477735"
      esperado: VÁLIDO
      descricao: "CPF fictício válido (exemplo)"
    - cpf: "11111111111"
      esperado: INVÁLIDO
      descricao: "Todos os dígitos iguais (rejeitado por lei)"
    - cpf: "00000000000"
      esperado: INVÁLIDO
      descricao: "Todos os dígitos 0"

################################################################################
# RESUMO EXECUTIVO
################################################################################

summary:
  tipo_programa: "CRUD de Beneficiários com validação CPF"
  
  funcionalidade_principal: |
    Permite inclusão ou alteração de beneficiário no arquivo 150 (BENEFICIARIO).
    Implementa validações básicas (campos obrigatórios, CPF válido).
    Calcula idade e aplica regra de suspensão para maiores de 75 anos.
    Impede duplicação de CPF.
    
  tabelas_afetadas:
    - BENEFICIARIO (arquivo 150): INSERT/UPDATE
    
  campos_criticos:
    - CPF: chave primária, validado por módulo 11
    - NOME: obrigatório
    - DT-NASCIMENTO: obrigatório, usado para cálculo de idade
    - STATUS: determinado por lógica de negócio (padrão 'A', suspenso se > 75 anos)
    
  regras_criticas:
    - "CPF deve ser válido (módulo 11)"
    - "Não permitir duplicação de CPF"
    - "Idade > 75 anos: status = 'S'"
    - "Em alteração: CPF, DT-NASC, SEXO, DT-CADASTRO imutáveis"
    
  lacunas_identificadas:
    - "Sem validação de data real (ex: 32/13)"
    - "Sem validação cruzada de COD-PROGRAMA"
    - "Sem validação cruzada de COD-REGIAO"
    - "Sem validação de NIS"
    - "Idade calculada por truncamento de ano (imprecisa)"
    - "Limite de 75 anos não justificado"
    - "Transações sem garantia ACID completa"
    
  historico_manutencao:
    - 15/03/1997: Criação (CARLOS ROBERTO DA SILVA)
    - 22/08/2005: Adição validação CPF (MARCIA HELENA)
    - 10/01/2011: Ajuste status idoso > 75 anos (JOSE FERREIRA)
    - Última alteração: 10/01/2011 (15 anos de estabilidade)
    
  risco_geral: MÉDIO-ALTO
  justificativa: |
    Programa estável há 15 anos.
    Validações CPF e unicidade são críticas.
    Porém, múltiplas lacunas de validação (datas, referências externas, NIS).
    Lógica de idade e suspensão necessita justificativa de negócio.


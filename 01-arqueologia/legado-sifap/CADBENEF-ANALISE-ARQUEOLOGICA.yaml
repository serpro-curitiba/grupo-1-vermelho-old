################################################################################
# REGRAS DE NEGÓCIO - EXTRAÍDAS
################################################################################

business_rules:
  - id: BR-001
    rule: "Operação de beneficiário deve ser I (Inclusão) ou A (Alteração)"
    line_range: "L119-L124"
    fields: ["#OPER"]
    validacao_type: "VALIDAÇÃO_OPERAÇÃO"
    risk_level: CRÍTICO
    impacto: "Rejeita operação inválida imediatamente"
    mensagem_erro: "OPERACAO INVALIDA - INFORME I OU A"

  - id: BR-002
    rule: "CPF é obrigatório para qualquer operação"
    line_range: "L126-L131"
    fields: ["CPF"]
    validacao_type: "VALIDAÇÃO_CAMPO_OBRIGATORIO"
    risk_level: CRÍTICO
    impacto: "Registros sem CPF são rejeitados"
    mensagem_erro: "CPF OBRIGATORIO"
    observacao: "CPF é chave primária de BENEFICIARIO"

  - id: BR-003
    rule: |
      Validação de CPF usando algoritmo Módulo 11
      - Primeiro dígito: soma ponderada (P=10 a 2) dos primeiros 9 dígitos
      - Se resto < 2, DV1 = 0; senão DV1 = 11 - resto
      - Segundo dígito: soma ponderada (P=11 a 2) dos primeiros 10 dígitos
      - Se resto < 2, DV2 = 0; senão DV2 = 11 - resto
      - Ambos DV1 e DV2 devem bater com dígitos 10 e 11 do CPF
    line_range: "L267-L318"
    fields: ["CPF"]
    validacao_type: "VALIDAÇÃO_CHECKSUM"
    risk_level: CRÍTICO
    impacto: "Rejeita CPFs com dígitos verificadores incorretos"
    mensagem_erro: "CPF INVALIDO - DIGITO VERIFICADOR INCORRETO"
    chamada: "PERFORM VALIDA-CPF"
    algoritmo_detalhe: |
      Função interna VALIDA-CPF (linhas 267-318):
      1. Extrai 11 dígitos de #CPF via SUBSTR (L272-L275)
      2. Calcula DV1: SOMA = DIG(1)*10 + DIG(2)*9 + ... + DIG(9)*2
      3. RESTO = SOMA MOD 11
      4. Se RESTO < 2: DV1 = 0, senão DV1 = 11 - RESTO
      5. Valida DV1 contra DIG(10) (L289-L291)
      6. Calcula DV2: SOMA = DIG(1)*11 + DIG(2)*10 + ... + DIG(10)*2
      7. RESTO = SOMA MOD 11
      8. Se RESTO < 2: DV2 = 0, senão DV2 = 11 - RESTO
      9. Valida DV2 contra DIG(11) (L305-L307)

  - id: BR-004
    rule: "Nome é obrigatório"
    line_range: "L133-L138"
    fields: ["NOME"]
    validacao_type: "VALIDAÇÃO_CAMPO_OBRIGATORIO"
    risk_level: CRÍTICO
    impacto: "Registros sem nome são rejeitados"
    mensagem_erro: "NOME OBRIGATORIO"

  - id: BR-005
    rule: "Data de nascimento é obrigatória (formato AAAAMMDD)"
    line_range: "L140-L145"
    fields: ["DT-NASCIMENTO"]
    validacao_type: "VALIDAÇÃO_CAMPO_OBRIGATORIO"
    risk_level: CRÍTICO
    impacto: "Registros sem DT-NASCIMENTO são rejeitados"
    mensagem_erro: "DATA NASCIMENTO OBRIGATORIA"
    observacao: "Não há validação de data válida (ex: 32/13)"

  - id: BR-006
    rule: "Sexo deve ser M (Masculino) ou F (Feminino)"
    line_range: "L147-L152"
    fields: ["SEXO"]
    validacao_type: "VALIDAÇÃO_ENUM"
    risk_level: CRÍTICO
    impacto: "Valores de sexo inválidos (ex: 'X') são rejeitados"
    mensagem_erro: "SEXO INVALIDO"

  - id: BR-007
    rule: "Em operação de INCLUSÃO (I), beneficiário não deve existir préviamente"
    line_range: "L154-L164"
    fields: ["#OPER", "CPF"]
    validacao_type: "VALIDAÇÃO_UNICIDADE"
    risk_level: CRÍTICO
    impacto: "Impede duplicação de beneficiários com mesmo CPF"
    mensagem_erro: "BENEFICIARIO JA CADASTRADO"
    sql_equivalente: "UNIQUE constraint em CPF"

  - id: BR-008
    rule: "Em operação de ALTERAÇÃO (A), beneficiário deve existir"
    line_range: "L166-L171"
    fields: ["#OPER", "CPF"]
    validacao_type: "VALIDAÇÃO_EXISTENCIA"
    risk_level: CRÍTICO
    impacto: "Não permite alterar CPF inexistente"
    mensagem_erro: "BENEFICIARIO NAO ENCONTRADO PARA ALTERACAO"

  - id: BR-009
    rule: "Cálculo da idade a partir de data de nascimento"
    line_range: "L173-L177"
    fields: ["DT-NASCIMENTO", "#IDADE"]
    validacao_type: "CÁLCULO"
    risk_level: MÉDIO
    formula: "#IDADE = ANO_ATUAL - ANO_NASCIMENTO"
    impacto: |
      Idade é calculada apenas por ano (sem considerar mês/dia).
      Exemplo: nascido em 2000-12-31, em 2026-01-01 terá idade 25
      (embora tenha apenas 1 dia de 25 anos).
    observacao: "Aproximação grosseira, não segue normas civis"

  - id: BR-010
    rule: "Status inicial padrão para novo beneficiário é 'A' (Ativo)"
    line_range: "L179-L182"
    fields: ["STATUS"]
    validacao_type: "REGRA_NEGOCIO"
    risk_level: MÉDIO
    impacto: "Todo beneficiário novo inicia como ATIVO"
    condicao: "Apenas em operação I (INCLUSÃO)"
    observacao: "Pode ser sobrescrito por regra de idade (BR-011)"

  - id: BR-011
    rule: "Beneficiários com idade > 75 anos recebem status 'S' (Suspenso)"
    line_range: "L184-L187"
    fields: ["#IDADE", "STATUS"]
    validacao_type: "REGRA_NEGOCIO"
    risk_level: ALTO
    impacto: "Beneficiários acima de 75 anos são automaticamente suspensos"
    condicao: "#IDADE > 75"
    status_atribuido: "S (Suspenso)"
    observacao: |
      Esta regra foi adicionada em 10/01/2011 (ajuste status idoso).
      Pode sobrescrever o status 'A' padrão da BR-010.
      Impacto: pode estar relacionado a benefícios para idosos.

  - id: BR-012
    rule: "Em INCLUSÃO: todos os campos de entrada são gravados; DT-CADASTRO e DT-ATUALIZACAO recebem data de hoje"
    line_range: "L194-L208"
    fields: ["DT-CADASTRO", "DT-ATUALIZACAO"]
    validacao_type: "REGRA_NEGOCIO"
    risk_level: MÉDIO
    impacto: "Beneficiário novo tem data de cadastro = hoje"
    observacao: "Permite rastreamento de quando o beneficiário foi criado"

  - id: BR-013
    rule: "Em ALTERAÇÃO: CPF, DT-NASCIMENTO, SEXO, DT-CADASTRO NÃO são atualizáveis"
    line_range: "L210-L228"
    fields: ["CPF", "DT-NASCIMENTO", "SEXO"]
    validacao_type: "REGRA_NEGOCIO"
    risk_level: ALTO
    impacto: "Campos sensíveis são imutáveis após criação"
    campos_nao_atualizaveis: ["CPF", "DT-NASCIMENTO", "SEXO", "DT-CADASTRO"]
    campos_atualizaveis: ["NOME", "ENDERECO", "MUNICIPIO", "UF", "CEP", "TELEFONE", "RG", "STATUS", "RENDA-FAMILIAR", "NUM-DEPENDENTES"]
    observacao: "Após alteração, DT-ATUALIZACAO é atualizada"

################################################################################
# MISTÉRIOS DESCOBERTOS - ANOMALIAS E LACUNAS
################################################################################

mysteries:
  - id: M-001
    titulo: "Validação incompleta de data de nascimento"
    descricao: |
      O programa obtém a data de nascimento (DT-NASC) mas:
      1. Não valida se é uma data real (ex: 32/13/2000 seria aceito)
      2. Não valida se está no futuro
      3. Não valida limites de idade mínima
      Risco: Dados corrompidos no arquivo 150
    linha: "L140-L145"
    severidade: MÉDIO
    sugestao: |
      Deveria verificar:
      - MÊS entre 01-12
      - DIA válido para o mês (com cálculo de bissexto)
      - DT-NASC <= DT-HOJE
      - IDADE >= 18 (presumido para beneficiários)

  - id: M-002
    titulo: "Arredondamento de idade por truncamento"
    descricao: |
      Idade é calculada como (ANO_ATUAL - ANO_NASCIMENTO),
      ignorando mês e dia. Isso cria anomalia:
      - Alguém nascido em 31/12/1950
      - Em 01/01/2026, teria 76 anos (correto)
      - Em 31/12/1950 + 1 dia = 01/01/1951, teria 75 anos (ERRADO)
      Impacto: Beneficiários podem ser suspensos (BR-011) no dia errado
    linha: "L173-L177"
    severidade: ALTO
    sugestao: |
      Deveria calcular idade como:
      IDADE = ANO_ATUAL - ANO_NASCIMENTO - 1, se (MÊS_ATUAL < MÊS_NASC OR (MÊS_ATUAL = MÊS_NASC AND DIA_ATUAL < DIA_NASC))

  - id: M-003
    titulo: "Limite de 75 anos para suspensão: justificativa?"
    descricao: |
      A regra BR-011 define limite rígido em 75 anos.
      Questões:
      - Por que 75 e não 70, 65 ou 80?
      - É uma regra de programa social específico?
      - Há política governamental associada?
      - Data de origem: 10/01/2011 (ajuste JOSE FERREIRA)
      Risco: Regra pode estar desatualizada ou ser erro de transcription
    linha: "L184-L187"
    severidade: ALTO
    sugestao: "Consultar com negócio origem desta regra (JOSE FERREIRA)"

  - id: M-004
    titulo: "CPF de 0 é rejeitado, mas a query da VIEW permanece"
    descricao: |
      Linha 156 valida: IF #CPF = 0, erro
      Mas isto é redundante: em INCLUSÃO, há IF #OPER = 'I' AND #FOUND,
      e #FOUND vem de FIND BENEFICIARIO-V WITH CPF = #CPF.
      Se #CPF = 0, é improvável que haja um registro com CPF=0.
      Questão: Há beneficiários com CPF=0 no banco? Isso é um bug de dados.
    linha: "L126-L131 (validação), L148-L154 (query)"
    severidade: MÉDIO
    sugestao: |
      1. Verificar se BENEFICIARIO tem CPF=0 no banco
      2. Se sim: migração de dados para corrigir
      3. Se não: validação é desnecessária

  - id: M-005
    titulo: "Campos de endereço e contato podem ser nulos na VIEW"
    descricao: |
      A estrutura VIEW não marca ENDERECO, MUNICIPIO, UF, CEP, TELEFONE, RG como NOT NULL.
      Mas o programa permite inserir beneficiário SEM preencher endereço completo.
      Questão: É intencional ou oversight?
      Impacto: Endereços incompletos dificultam correspondência física
    linha: "L12-L30 (VIEW)", "L194-L208 (STORE)"
    severidade: MÉDIO
    sugestao: |
      Definir política: 
      - Todos os endereços devem ser completos?
      - Ou endereço é "opcional" para beneficiários em abrigos?

  - id: M-006
    titulo: "COD-PROGRAMA e COD-REGIAO não são validados contra tabelas"
    descricao: |
      O programa aceita qualquer N4 para COD-PROGRAMA e N2 para COD-REGIAO.
      Não há validação se código existe em tabelas de programa ou região.
      Risco: Dados órfãos (referências para programas/regiões inexistentes)
    linha: "L95-L96, L104"
    severidade: ALTO
    sugestao: |
      Implementar:
      - FIND PROGRAMA WITH COD-PROGRAMA = #COD-PROG
      - FIND REGIAO WITH COD-REGIAO = #COD-REG
      - Rejeitar se não encontrar

  - id: M-007
    titulo: "NIS (Número Identificação Social) é aceito sem validação"
    descricao: |
      NIS é campo de 11 dígitos mas:
      1. Não há validação de checksum (como em CPF)
      2. Não há validação se NIS é único (pode haver duplicatas)
      3. Não há validação se NIS existe em cadastro nacional
      Risco: Dados duplicados, inconsistência com INSS
    linha: "L101"
    severidade: ALTO
    sugestao: |
      Consultar com:
      - Responsável de integração INSS
      - Se há algoritmo de validação NIS
      - Se NIS deve ser único por beneficiário

  - id: M-008
    titulo: "Renda familiar e número de dependentes não são validados"
    descricao: |
      #RENDA-FAM pode ser 0 ou negativa (campo N9.2)
      #NUM-DEP pode ser 0 ou > 99 (campo N2)
      Não há validação lógica:
      - Renda negativa é inválida?
      - Se há dependentes, renda deve ser > limite?
      - Há inconsistência if RENDA-FAM = 0 e NUM-DEP > 0?
    linha: "L97-L98"
    severidade: MÉDIO
    sugestao: |
      Adicionar:
      - RENDA-FAM >= 0
      - NUM-DEP >= 0 AND NUM-DEP <= 99
      - Se NUM-DEP > 0, talvez RENDA-FAM > 0?

  - id: M-009
    titulo: "Não há validação cruzada de SEXO vs. regras de benefício"
    descricao: |
      O programa não menciona diferenças entre benefícios M/F.
      Questão: Há programas específicos por sexo?
      Exemplo: Licença maternidade (apenas F) vs. paternidade (apenas M)?
    linha: "L147-L152"
    severidade: BAIXO
    sugestao: |
      Verificar com negócio se há validações sexo-específicas.
      Pode estar em programa chamado por CADBENEF ou no módulo de benefícios.

  - id: M-010
    titulo: "Lógica de transação pode deixar dados inconsistentes"
    descricao: |
      Linha 209: "END TRANSACTION" e Linha 222: "END TRANSACTION"
      Questão: Se falha de I/O acontece depois de UPDATE mas antes de END TRANSACTION?
      O banco de dados está protegido por transação ACID?
      Adabas oferece garantias transacionais equivalentes a SQL?
    linha: "L209, L222"
    severidade: ALTO
    sugestao: |
      Verificar documentação Adabas:
      - Nível de isolamento de transações
      - Comportamento em rollback
      - Possibilidade de deadlock

  - id: M-011
    titulo: "Campos DT-CADASTRO e DT-ATUALIZACAO gravados sem timestamp"
    descricao: |
      Usa *DATN que retorna apenas data (AAAAMMDD), sem hora (HHMMSS).
      Questão: Se múltiplas operações no mesmo dia, como rastrear sequência?
      Potencial perda de auditoria de tempo preciso.
    linha: "L109-L112"
    severidade: MÉDIO
    sugestao: "Considerar adicionar timestamp completo (com hora)"

  - id: M-012
    titulo: "Mensagens de erro em português podem quebrar em sistemas multilíngues"
    descricao: |
      Todas as mensagens hardcoded em português.
      Se sistema migrar para cloud com suporte multilíngue, será necessário refatoring.
    linha: "L119-L187, L209-L228"
    severidade: BAIXO
    sugestao: "Considerar externalizar mensagens em arquivo de i18n"


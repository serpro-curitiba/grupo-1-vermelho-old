name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !reference/**
            !**/node_modules

  build-test-docker:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Locate Maven project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          POM_PATH="$(find . -name pom.xml -not -path './reference/*' | head -n 1 || true)"
          if [ -z "$POM_PATH" ]; then
            echo "Nenhum pom.xml encontrado no repositório" >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$POM_PATH")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Run Maven tests
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          if [ -x "$PROJECT_DIR/mvnw" ]; then
            (cd "$PROJECT_DIR" && ./mvnw -B test)
          else
            (cd "$PROJECT_DIR" && mvn -B test)
          fi

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          DOCKER_CONTEXT="$PROJECT_DIR"
          if [ ! -f "$DOCKER_CONTEXT/Dockerfile" ] && [ -f "prototype/backend/Dockerfile" ]; then
            DOCKER_CONTEXT="prototype/backend"
          fi
          if [ ! -f "$DOCKER_CONTEXT/Dockerfile" ]; then
            echo "Nenhum Dockerfile encontrado para build da imagem" >&2
            exit 1
          fi
          docker build -t sifap-ci:${{ github.sha }} "$DOCKER_CONTEXT"

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ hashFiles('infra/*.tf') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra validate
